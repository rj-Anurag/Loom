services:
  - type: web
    name: loom-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/Dockerfile
    dockerCommand: python -m loom.api.start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: loom-redis
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: EMBEDDING_PROVIDER
        value: stub
      - key: SUMMARIZATION_PROVIDER
        value: stub
      - key: SUMMARIZATION_INTERVAL_MINUTES
        value: 15
      - key: SUMMARIZATION_WINDOW_MINUTES
        value: 10
      - key: SUMMARIZATION_MAX_UNITS_PER_GROUP
        value: 50
      - key: SUMMARIZATION_MIN_UNITS
        value: 5
      - key: ALLOW_LEGACY_UUID_TOKENS
        value: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true

  - type: keyvalue
    name: loom-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: loom-postgres
    plan: free
    postgresMajorVersion: "16"
    databaseName: loom
    user: loom
