<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 4px; }
  .project-meta { color: #9ca3af; font-size: 0.875rem; margin-bottom: 24px; }
  .card {
    background: #16213e;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1rem;
    font-weight: 600;
    color: #4f46e5;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .badge-idle { background: #374151; color: #9ca3af; }
  .badge-working { background: #065f46; color: #6ee7b7; }
  .badge-blocked { background: #7f1d1d; color: #fca5a5; }
  .badge-conflict { background: #7f1d1d; color: #fca5a5; }
  .agent-list { list-style: none; }
  .agent-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #1e293b;
  }
  .agent-list li:last-child { border-bottom: none; }
  .agent-id { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8125rem; }
  .context-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .context-item {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 14px 16px;
    transition: border-color 0.15s ease;
  }
  .context-item.role-human { border-left: 4px solid #3b82f6; }
  .context-item.role-ai { border-left: 4px solid #a855f7; }
  .context-item.role-other { border-left: 4px solid #64748b; }
  .context-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-size: 0.8125rem;
  }
  .context-type {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  }
  .context-type.type-user { background: #1e3a8a; color: #bfdbfe; border: 1px solid #3b82f6; }
  .context-type.type-ai { background: #581c87; color: #e9d5ff; border: 1px solid #a855f7; }
  .context-type.type-other { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }
  .context-body {
    font-size: 0.875rem; color: #e2e8f0; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; font-family: inherit;
  }
  .context-body.collapsed {
    max-height: 120px; overflow: hidden; position: relative;
  }
  .context-body.collapsed::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: linear-gradient(transparent, #0f172a);
  }
  .expand-btn {
    background: transparent; border: none; color: #60a5fa;
    font-size: 0.75rem; cursor: pointer; margin-top: 6px; padding: 2px 0;
    font-weight: 500; display: inline-block;
  }
  .expand-btn:hover { text-decoration: underline; }
  .context-meta { font-size: 0.75rem; color: #64748b; }
  .empty-state { color: #6b7280; font-style: italic; font-size: 0.875rem; }
  .loading { color: #6b7280; font-size: 0.875rem; }
  .error-state { color: #fca5a5; font-size: 0.875rem; }
  .grid-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  .conflict-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #1e293b;
  }
  .conflict-item:last-child { border-bottom: none; }
  .conflict-type { font-size: 0.8125rem; color: #fca5a5; }
  .conflict-time { font-size: 0.75rem; color: #6b7280; }
  .context-controls {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .sort-btn {
    background: #1e293b; color: #94a3b8; border: 1px solid #334155;
    padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;
  }
  .sort-btn:hover { background: #334155; color: #f1f5f9; }
</style>
</head>
<body>
<div class="container" id="app">
  <div id="project-header">
    <h1 id="project-name">Loading...</h1>
    <div class="project-meta" id="project-meta"></div>
  </div>
  <div class="grid-2">
    <div class="card" id="agents-card">
      <h2>Active Agents</h2>
      <div id="agents-content"><span class="loading">Loading...</span></div>
    </div>
    <div class="card" id="conflicts-card">
      <h2>Pending Conflicts</h2>
      <div id="conflicts-content"><span class="loading">Loading...</span></div>
    </div>
  </div>
  <div class="card" id="context-card">
    <div class="context-controls">
      <h2>Chat History & Context</h2>
      <button id="sort-toggle-btn" class="sort-btn">Sort: Newest First</button>
    </div>
    <div id="context-content"><span class="loading">Loading...</span></div>
  </div>
</div>
<script>
(function() {
  // ── Auth ──────────────────────────────────────────────────────────────
  let token = '';
  const hash = window.location.hash;
  if (hash.startsWith('#token=')) {
    token = hash.slice(7);
    // Persist in sessionStorage so reload works (without persisting to browser history)
    sessionStorage.setItem('loom_dashboard_token', token);
    history.replaceState(null, '', window.location.pathname);
  } else {
    token = sessionStorage.getItem('loom_dashboard_token');
  }

  if (!token) {
    document.getElementById('project-name').textContent = 'Unauthorized';
    document.getElementById('project-meta').textContent = 'No token found. Open the dashboard from the Loom extension popup.';
    return;
  }

  // ── Helpers ───────────────────────────────────────────────────────────
  const API_BASE = window.location.origin;
  let contextSortAscending = false;

  async function api(url) {
    const res = await fetch(API_BASE + url, {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(res.status + ': ' + body);
    }
    return res.json();
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function parseMessageRole(u) {
    var rawContent = u.content || '';
    if (/^(User|Human|user|human):/i.test(rawContent)) {
      return {
        roleLabel: 'Human Message',
        roleClass: 'role-human',
        typeClass: 'type-user',
        icon: '👤',
        bodyText: rawContent.replace(/^(User|Human|user|human):\s*/i, '')
      };
    }
    if (/^(AI|Assistant|ai|assistant):/i.test(rawContent)) {
      return {
        roleLabel: 'AI Message',
        roleClass: 'role-ai',
        typeClass: 'type-ai',
        icon: '🤖',
        bodyText: rawContent.replace(/^(AI|Assistant|ai|assistant):\s*/i, '')
      };
    }
    if (u.trust_tier === 'user') {
      return {
        roleLabel: 'Human Message',
        roleClass: 'role-human',
        typeClass: 'type-user',
        icon: '👤',
        bodyText: rawContent
      };
    }
    var typeLabel = u.type ? u.type.toUpperCase() : 'AGENT';
    return {
      roleLabel: typeLabel,
      roleClass: 'role-other',
      typeClass: 'type-other',
      icon: '⚡',
      bodyText: rawContent
    };
  }

  // ── Extract project_id from path ──────────────────────────────────────
  // URL pattern: /v1/projects/{project_id}/dashboard
  const pathParts = window.location.pathname.split('/');
  const projectIdx = pathParts.indexOf('projects');
  const projectId = projectIdx !== -1 && projectIdx + 1 < pathParts.length
    ? pathParts[projectIdx + 1]
    : null;

  if (!projectId) {
    document.getElementById('project-name').textContent = 'Invalid URL';
    document.getElementById('project-meta').textContent = 'Could not extract project ID from path.';
    return;
  }

  // ── Section loaders (hoisted so WS events + polling can call them) ────

  async function loadProjectInfo() {
    try {
      const project = await api('/v1/projects/' + projectId);
      document.getElementById('project-name').textContent = escapeHtml(project.name || 'Unnamed Project');
      document.getElementById('project-meta').textContent = 'ID: ' + escapeHtml(project.id) + ' &middot; Created: ' + escapeHtml(project.created_at || 'unknown');
    } catch (err) {
      document.getElementById('project-name').textContent = 'Error loading project';
      document.getElementById('project-meta').textContent = err.message;
    }
  }

  async function loadAgents() {
    try {
      const agents = await api('/v1/projects/' + projectId + '/agents/presence');
      const el = document.getElementById('agents-content');
      if (!agents || agents.length === 0) {
        el.innerHTML = '<span class="empty-state">No active agents</span>';
        return;
      }
      var ALLOWED_STATUSES = { 'online': true, 'idle': true, 'working': true, 'blocked': true, 'offline': true };
      const items = agents.map(function(a) {
        var safeStatus = ALLOWED_STATUSES[a.status] ? a.status : 'idle';
        const badgeClass = 'badge badge-' + safeStatus;
        return '<li>'
          + '<span class="agent-id">' + escapeHtml(a.agent_id || 'unknown') + '</span>'
          + '<span class="' + badgeClass + '">' + escapeHtml(safeStatus) + '</span>'
          + '</li>';
      }).join('');
      el.innerHTML = '<ul class="agent-list">' + items + '</ul>';
    } catch (err) {
      document.getElementById('agents-content').innerHTML = '<span class="error-state">' + escapeHtml(err.message) + '</span>';
    }
  }

  async function loadContext() {
    try {
      const ctx = await api('/v1/projects/' + projectId + '/context?budget=32000');
      const el = document.getElementById('context-content');
      if (!ctx || !ctx.units || ctx.units.length === 0) {
        el.innerHTML = '<span class="empty-state">No context units captured yet for this project.</span>';
        return;
      }

      var units = ctx.units.slice(0, 100);
      if (contextSortAscending) {
        units.reverse();
      }

      const items = units.map(function(u, idx) {
        var parsed = parseMessageRole(u);
        var time = u.created_at ? new Date(u.created_at).toLocaleString() : '';
        var isLong = parsed.bodyText.length > 350;
        var bodyClass = isLong ? 'context-body collapsed' : 'context-body';
        var bodyId = 'ctx-body-' + idx;
        var btnHtml = isLong ? '<button class="expand-btn" data-target="' + bodyId + '">+ Show full message</button>' : '';

        return '<li class="context-item ' + escapeHtml(parsed.roleClass) + '">'
          + '<div class="context-header">'
          +   '<span class="context-type ' + escapeHtml(parsed.typeClass) + '">' + parsed.icon + ' ' + escapeHtml(parsed.roleLabel) + '</span>'
          +   '<span class="context-meta">' + escapeHtml(time) + ' &middot; Tier: ' + escapeHtml(u.trust_tier || 'agent') + '</span>'
          + '</div>'
          + '<div id="' + bodyId + '" class="' + bodyClass + '">' + escapeHtml(parsed.bodyText) + '</div>'
          + btnHtml
          + '</li>';
      }).join('');

      el.innerHTML = '<ul class="context-list">' + items + '</ul>';

      // Attach event listeners to expand/collapse buttons
      document.querySelectorAll('.expand-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = btn.getAttribute('data-target');
          var targetEl = document.getElementById(targetId);
          if (targetEl) {
            var isCollapsed = targetEl.classList.contains('collapsed');
            if (isCollapsed) {
              targetEl.classList.remove('collapsed');
              btn.textContent = '- Collapse message';
            } else {
              targetEl.classList.add('collapsed');
              btn.textContent = '+ Show full message';
            }
          }
        });
      });
    } catch (err) {
      document.getElementById('context-content').innerHTML = '<span class="error-state">' + escapeHtml(err.message) + '</span>';
    }
  }

  // Sort toggle handler
  document.getElementById('sort-toggle-btn').addEventListener('click', function() {
    contextSortAscending = !contextSortAscending;
    this.textContent = contextSortAscending ? 'Sort: Oldest First (Conversation Flow)' : 'Sort: Newest First';
    loadContext();
  });

  async function loadConflicts() {
    try {
      const conflicts = await api('/v1/projects/' + projectId + '/conflicts');
      const el = document.getElementById('conflicts-content');
      if (!conflicts || conflicts.length === 0) {
        el.innerHTML = '<span class="empty-state">No pending conflicts</span>';
        return;
      }
      const items = conflicts.map(function(c) {
        const time = c.created_at ? new Date(c.created_at).toLocaleString() : '';
        return '<div class="conflict-item">'
          + '<div><div class="conflict-type">' + escapeHtml(c.conflict_type || 'unknown') + '</div>'
          + '<div class="conflict-time">' + escapeHtml(time) + '</div></div>'
          + '<span class="badge badge-conflict">pending</span>'
          + '</div>';
      }).join('');
      el.innerHTML = items;
    } catch (err) {
      document.getElementById('conflicts-content').innerHTML = '<span class="error-state">' + escapeHtml(err.message) + '</span>';
    }
  }

  // ── WebSocket Client ──────────────────────────────────────────────────

  var WS_BASE = window.location.origin.replace(/^http/, 'ws');
  var WS_RECONNECT_DELAYS = [1000, 2000, 4000, 8000, 15000, 30000];
  var POLL_INTERVAL_MS = 10000;

  var ws = null;
  var wsReconnectAttempt = 0;
  var wsReconnectTimer = null;
  var pollTimer = null;
  var wsConnected = false;

  function showConnectionStatus(state) {
    var el = document.getElementById('ws-status');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ws-status';
      el.style.cssText = 'position:fixed;bottom:8px;right:8px;font-size:0.7rem;padding:3px 7px;border-radius:4px;z-index:100;font-family:monospace';
      document.body.appendChild(el);
    }
    if (state === 'connected') {
      el.textContent = '\u25CF live';
      el.style.background = '#065f46';
      el.style.color = '#6ee7b7';
    } else {
      el.textContent = '\u25CB polling';
      el.style.background = '#374151';
      el.style.color = '#9ca3af';
    }
  }

  function startPollingFallback() {
    if (pollTimer) return;
    pollTimer = setInterval(function() {
      loadAgents();
      loadContext();
      loadConflicts();
    }, POLL_INTERVAL_MS);
  }

  function stopPollingFallback() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function connectWebSocket() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
      return; // Already connected or connecting
    }

    var url = WS_BASE + '/v1/projects/' + projectId + '/events?token=' + encodeURIComponent(token);
    ws = new WebSocket(url);

    ws.onopen = function() {
      wsConnected = true;
      wsReconnectAttempt = 0;
      stopPollingFallback();
      showConnectionStatus('connected');
    };

    ws.onmessage = function(event) {
      try {
        var msg = JSON.parse(event.data);
        switch (msg.type) {
          case 'agent_online':
          case 'agent_offline':
          case 'agent_heartbeat':
            loadAgents();
            break;
          case 'context_created':
            loadContext();
            break;
          case 'conflict_created':
            loadConflicts();
            break;
        }
      } catch (e) {
        console.warn('WS: ignoring malformed message', e);
      }
    };

    ws.onclose = function() {
      wsConnected = false;
      ws = null;
      showConnectionStatus('disconnected');
      startPollingFallback();
      scheduleReconnect();
    };

    ws.onerror = function() {
      // onclose fires after onerror — reconnect is handled there
    };
  }

  function scheduleReconnect() {
    if (wsReconnectTimer) return;
    var idx = Math.min(wsReconnectAttempt, WS_RECONNECT_DELAYS.length - 1);
    var delay = WS_RECONNECT_DELAYS[idx];
    wsReconnectAttempt++;
    wsReconnectTimer = setTimeout(function() {
      wsReconnectTimer = null;
      if (!wsConnected) {
        connectWebSocket();
      }
    }, delay);
  }

  // ── Bootstrap ─────────────────────────────────────────────────────────

  async function loadDashboard() {
    await loadProjectInfo();
    loadAgents();
    loadContext();
    loadConflicts();
    connectWebSocket();
  }

  loadDashboard();
})();
</script>
</body>
</html>
