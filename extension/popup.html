<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loom — Context Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.linked {
      border-left: 3px solid #22c55e;
    }
    .status.unlinked {
      border-left: 3px solid #f59e0b;
    }
    .status.error {
      border-left: 3px solid #ef4444;
    }
    label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
      margin-top: 8px;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
    }
    button.primary {
      background: #4f46e5;
      color: white;
    }
    button.primary:hover {
      background: #4338ca;
    }
    button.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.secondary {
      background: transparent;
      color: #999;
      border: 1px solid #444;
    }
    .error-text {
      color: #ef4444;
      font-size: 12px;
      margin-top: 8px;
    }
    .hidden {
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #444;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🔗 Loom Bridge</h1>

  <div id="status" class="status unlinked">
    <span id="status-text">Checking...</span>
  </div>

  <div id="link-section">
    <label for="project-select">Link to project</label>
    <select id="project-select">
      <option value="">— Loading projects —</option>
    </select>
    <label for="new-project-name">Or create new project</label>
    <input type="text" id="new-project-name" placeholder="Project name..." />

    <button id="link-btn" class="primary" disabled>Link Chat</button>
    <div id="error-msg" class="error-text hidden"></div>
  </div>

  <div id="linked-section" class="hidden">
    <p style="font-size:13px;">
      ✅ Linked to <strong id="linked-project-name">—</strong>
    </p>
    <button id="unlink-btn" class="secondary">Unlink</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
