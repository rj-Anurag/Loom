name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install from checkout (macOS and Linux)
        if: runner.os != 'Windows'
        run: ./install.sh --python python
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
      - name: Install from checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install.ps1 -Python python
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
      - name: Verify installed CLI (macOS and Linux)
        if: runner.os != 'Windows'
        run: '"$PIPX_BIN_DIR/loom" --version'
        env:
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
      - name: Verify installed CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PIPX_BIN_DIR\loom.exe" --version'
        env:
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy loom

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Apply database migrations
        run: python -m loom.services.context.migrations.runner up
        env:
          DATABASE_URL: postgresql://loom:loom@localhost:5432/loom
      - run: pytest --cov=loom --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: pip install -e . bandit pip-audit
      - run: bandit -r loom/ -ll
      - run: pip-audit --skip-editable
