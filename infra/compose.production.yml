x-loom-service: &loom-service
  image: loom-api:${LOOM_IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: infra/Dockerfile
  env_file:
    - ../.env
  restart: unless-stopped

services:
  api:
    <<: *loom-service
    command: ["uvicorn", "loom.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      args:
        LOOM_API_INTERNAL_URL: http://api:8000
    environment:
      LOOM_API_INTERNAL_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  embedding-worker:
    <<: *loom-service
    command: ["python", "-m", "loom.services.retrieval.embedding_worker"]

  summarizer:
    <<: *loom-service
    command: ["python", "-m", "loom.services.retrieval.summarizer"]
